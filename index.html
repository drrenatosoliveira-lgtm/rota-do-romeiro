<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rota do Romeiro</title>
<meta name="description" content="Mapa ao vivo da Rota da Luz: Taubaté → Basílica de Aparecida, 52 km sem Dutra.">
<meta name="theme-color" content="#14306b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: mapa em tela cheia; placar de km no topo; próxima instrução e ações embaixo; gaveta "Mais" sobe por cima. */
:root{
  --manto:#14306b;      /* azul do manto de N. Sra. Aparecida */
  --manto-2:#1f4596;
  --ouro:#c99a2e;       /* dourado da coroa */
  --fundo:#f3f4f7;
  --cartao:#ffffff;
  --texto:#16192a;
  --sutil:#5b6178;
  --linha:#dfe2ea;
  --feito:#8a93ab;
  --perigo:#c62828;
  --ok:#1f7a4d;
  --aviso:#b26a00;
  --mapa-fundo:#e9ebe4;
  --via:#b9bcc4;
  --via-forte:#8c909b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --corpo:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --manto:#9db8ff;--manto-2:#7c9cf0;--ouro:#e3b850;--fundo:#0e1220;--cartao:#171c2e;--texto:#eef0f7;--sutil:#a2a9c0;--linha:#2a3150;--feito:#5d6684;--perigo:#ff6b6b;--ok:#5fd39a;--aviso:#ffb74d;--mapa-fundo:#1a1f2b;--via:#3b4256;--via-forte:#58607a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--fundo);color:var(--texto);font:16px/1.4 var(--corpo);overflow:hidden;-webkit-tap-highlight-color:transparent}
#mapa{position:fixed;inset:0;background:var(--mapa-fundo);z-index:0}
.leaflet-container{background:var(--mapa-fundo);font-family:var(--corpo)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}

/* placar */
#placar{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.placa{pointer-events:auto;background:var(--cartao);border-radius:14px;box-shadow:0 4px 18px rgba(10,20,50,.18);padding:10px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end;max-width:560px;margin:0 auto}
.rotulo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sutil);font-weight:600}
.km-grande{font:700 52px/0.95 var(--display);color:var(--manto);font-variant-numeric:tabular-nums}
.km-grande small{font-size:22px;font-weight:600;margin-left:4px;color:var(--sutil)}
.lado{text-align:right;font-variant-numeric:tabular-nums}
.lado b{font:600 22px/1 var(--display);display:block}
.barra{grid-column:1/-1;height:8px;background:var(--linha);border-radius:4px;overflow:hidden;margin-top:8px;position:relative}
.barra i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--manto-2),var(--ouro));width:0;border-radius:4px;transition:width .6s}
.marcos{grid-column:1/-1;position:relative;height:15px;font-size:11px;color:var(--sutil);margin-top:3px;white-space:nowrap}
.marcos span{position:absolute;top:0;transform:translateX(-50%)}
.marcos span:first-child{transform:none}
.marcos span:last-child{transform:translateX(-100%)}
.trocar{border:0;background:transparent;padding:0;text-align:left;font-size:13px;color:var(--sutil)}
.trocar b{color:var(--manto)}
.trocar u{color:var(--manto);text-underline-offset:2px}
select{font:inherit;font-size:16px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao);color:var(--texto)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--linha);color:var(--sutil)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chip.ruim{color:var(--aviso);background:color-mix(in srgb,var(--aviso) 14%,transparent)}
.chip.fora{color:var(--perigo);background:color-mix(in srgb,var(--perigo) 14%,transparent)}

/* alerta fora da rota */
#alerta{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 150px);z-index:600;max-width:560px;margin:0 auto;background:var(--perigo);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(160,0,0,.35)}
#alerta .seta{width:54px;height:54px;flex:none;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
#alerta .seta svg{transition:transform .4s}
#alerta strong{font:700 22px/1.05 var(--display);display:block}
#alerta span{font-size:14px;opacity:.95}
@media (prefers-reduced-motion:no-preference){#alerta{animation:pulsa 1.4s infinite}}
@keyframes pulsa{50%{box-shadow:0 6px 30px rgba(255,0,0,.6)}}

/* rodapé */
#rodape{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.proximo{pointer-events:auto;background:var(--cartao);border-radius:14px;box-shadow:0 4px 18px rgba(10,20,50,.18);padding:10px 14px;max-width:560px;margin:0 auto 10px;display:grid;gap:6px}
.linha-prox{display:flex;gap:10px;align-items:flex-start}
.linha-prox .dist{font:700 24px/1 var(--display);color:var(--manto);min-width:66px;font-variant-numeric:tabular-nums}
.linha-prox .txt{font-size:15px;line-height:1.3;min-width:0}
.linha-prox.apoio .dist{color:var(--ouro)}
.linha-prox.alerta-agua .txt{color:var(--aviso);font-weight:600}
.acoes{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.acoes button{background:var(--cartao);border:0;border-radius:12px;padding:9px 4px 7px;box-shadow:0 3px 12px rgba(10,20,50,.15);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--texto)}
.acoes button svg{width:22px;height:22px;stroke:var(--manto);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acoes button.ativo{background:var(--manto);color:var(--cartao)}
.acoes button.ativo svg{stroke:var(--cartao)}
#iniciar{pointer-events:auto;display:block;width:100%;max-width:560px;margin:0 auto 10px;background:var(--manto);color:var(--cartao);border:0;border-radius:14px;padding:14px;font:700 22px/1 var(--display);letter-spacing:.02em;box-shadow:0 6px 20px rgba(20,48,107,.35)}

/* gaveta */
#gaveta{position:fixed;inset:auto 0 0 0;z-index:900;max-height:86%;background:var(--cartao);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#veu{position:fixed;inset:0;z-index:850;background:rgba(5,10,25,.4)}
.gav-topo{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.gav-topo h2{font:700 26px/1 var(--display);margin:0;color:var(--manto)}
.fechar{border:0;background:var(--linha);border-radius:999px;width:36px;height:36px;font-size:20px;line-height:1}
.abas{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;flex:none}
.gav-topo{flex:none}
.abas button{border:1px solid var(--linha);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--sutil)}
.abas button[aria-selected="true"]{background:var(--manto);border-color:var(--manto);color:var(--cartao)}
.gav-corpo{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);align-items:start}
.lista li.passou{opacity:.45}
.lista .km{font:700 20px/1.1 var(--display);color:var(--manto);font-variant-numeric:tabular-nums}
.lista .t{min-width:0}
.lista .t b{display:block;font-size:15px}
.lista .t span{font-size:13px;color:var(--sutil)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.tag.terra{background:#e6d3b3;color:#5b3d10}
.tag.risco{background:color-mix(in srgb,var(--perigo) 18%,transparent);color:var(--perigo)}
.tag.apoio{background:color-mix(in srgb,var(--ouro) 22%,transparent);color:var(--texto)}
.bloco{background:var(--fundo);border-radius:12px;padding:12px 14px;margin:10px 0}
.bloco h3{margin:0 0 6px;font:700 19px/1.1 var(--display);color:var(--manto)}
.bloco p,.bloco li{font-size:15px;margin:4px 0}
.bloco ul{margin:4px 0;padding-left:18px}
.tel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tel a{display:block;text-decoration:none;background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;color:var(--texto)}
.tel a b{font:700 26px/1 var(--display);color:var(--perigo);display:block}
.botao{display:inline-block;border:0;background:var(--manto);color:var(--cartao);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none}
.botao.sec{background:var(--linha);color:var(--texto)}
input[type=range]{width:100%}
label{font-size:14px;color:var(--sutil)}
.legenda{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--sutil);margin-top:6px}
.legenda i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* marcadores */
.eu{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.4)}
.eu-cone{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-9px;margin-top:-34px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid rgba(26,115,232,.45);transform-origin:9px 34px}
.pino{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--corpo);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pino.basilica{width:38px;height:38px;background:var(--ouro);font-size:20px}
.pino.saida{width:30px;height:30px;background:var(--manto-2)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom.leaflet-right{margin-bottom:170px}
</style>
</head>
<body>
<div id="mapa" aria-label="Mapa da rota"></div>

<div id="placar">
  <div class="placa">
    <div>
      <div class="rotulo">Faltam até a Basílica</div>
      <div class="km-grande"><span id="kmFalta">52,1</span><small>km</small></div>
    </div>
    <div class="lado">
      <span class="chip" id="estado">GPS desligado</span>
      <b id="eta">—</b>
      <span class="rotulo" id="etaRot">chegada estimada</span>
    </div>
    <div class="barra"><i id="progresso"></i></div>
    <div class="marcos" id="marcos"></div>
  </div>
</div>

<div id="alerta" hidden role="alert">
  <div class="seta"><svg id="setaSvg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg></div>
  <div><strong id="alertaTit">Fora da rota</strong><span id="alertaTxt">Volte para a linha azul.</span></div>
</div>

<div id="rodape">
  <button id="iniciar">Começar caminhada (ligar GPS)</button>
  <div class="proximo" id="cardProx">
    <button class="trocar" id="bPartida">Saindo de: <b id="partidaNome">Catedral de Taubaté</b> · <u>trocar</u></button>
    <div class="linha-prox"><div class="dist" id="proxDist">0,0 km</div><div class="txt" id="proxTxt">Saída na Catedral de São Francisco das Chagas, centro de Taubaté.</div></div>
    <div class="linha-prox apoio"><div class="dist" id="apoioDist">—</div><div class="txt" id="apoioTxt">Próximo ponto de apoio</div></div>
  </div>
  <div class="acoes">
    <button id="bCentro" class="ativo" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>Seguir</button>
    <button id="bTela" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>Tela ligada</button>
    <button id="bEnviar"><svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Onde estou</button>
    <button id="bMais"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Roteiro</button>
  </div>
</div>

<div id="veu" hidden></div>
<section id="gaveta" hidden aria-label="Roteiro e informações">
  <div class="gav-topo"><h2>Rota da Luz · 52 km</h2><button class="fechar" id="bFechar" aria-label="Fechar">×</button></div>
  <div class="abas" role="tablist">
    <button role="tab" aria-selected="true" data-aba="passos">Passo a passo</button>
    <button role="tab" aria-selected="false" data-aba="apoio">Apoio</button>
    <button role="tab" aria-selected="false" data-aba="sos">Emergência</button>
    <button role="tab" aria-selected="false" data-aba="dicas">Dicas</button>
    <button role="tab" aria-selected="false" data-aba="teste">Testar</button>
  </div>
  <div class="gav-corpo" id="gavCorpo"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
